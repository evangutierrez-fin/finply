name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x', '26.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build
